services:
  app:
    build: .
    ports:
      - "3051:3051"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=America/Sao_Paulo
    env_file:
      - .env.local
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${HOST_NAME}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=${PORT-3051}
 
  sqlite-web:
    image: coleifer/sqlite-web
    restart: unless-stopped
    ports:
      - "3052:8080"
    volumes:
      - ./data:/data
    environment:
      - SQLITE_DATABASE=/data/dashboard.db
